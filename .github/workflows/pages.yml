name: the page

# A page that only updates when somebody pushes it goes stale the moment a project moves,
# and this is the whole reason the page exists. It reads the four repositories on a schedule
# and publishes only when a fact on it changed.
#
# **What was asked for and what arrives are two different numbers, and the file records the
# second one rather than the first.** The cron is hourly at seventeen past, and between
# 18:17 on the 28th and 11:17 on the 29th seventeen of those hours came due and two ran — at
# 23:19, which is two minutes late, and at 05:47, which is thirty. No run waited in a queue:
# every one of the fifteen runs this repository has had began the second it was created.
# Seventeen became two, and nobody was told.
#
# That is the measurement and it is small, and it is written here as a measurement rather than
# as a rate. An eighteen-hour-old repository is not evidence about a schedule that is supposed
# to run for years, and the honest statement is what was seen and how long for. The next
# reader who wants to know should re-read it, not trust it.
#
# **Seventeen past the hour is still the right minute** and the reasoning for it has not
# changed: :00 is the minute everybody asks for, because everybody writes hourly schedules
# with `0 0 * * *`. What has changed is the argument that hourly beats daily, which said that
# a dropped job is an hour of staleness rather than a day of it. If most of them are dropped
# then a dropped job is five hours, and the argument does not hold. The page says when it
# last read the family, so a reader is never misled by how long ago that was; the cadence here
# is a claim about this repository, and a claim like that is the kind this file does not make.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      # **The keepalive's branch is forty-five days away, and this is how it is reached today.**
      # A schedule is the only thing that would otherwise reach it, and the schedule has run twice
      # in seventeen hours — so "wait and see" is not a plan for a rescue mechanism. This says out
      # loud that the silence is long enough, and the script then acts on that word.
      #
      # **It is a word, not a date.** Nothing here pretends to be a fact about the repository, and
      # the log still prints the real age of the last commit, so a run done this way is visibly not
      # a run the schedule would have done.
      as_if_the_silence_were_long_enough:
        description: "Run the keepalive as though this repository had been quiet for 45 days"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# Pages keeps only the newest deployment, so a second run cancels the first rather than
# deploying out of order.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  THE_BRANCH: main
  THE_SITE: https://steamnoid.github.io/ai-sdlc-landing
  # The four repositories, as owner/name and the directory each is checked out in. The page
  # holds no fact about any of them, so this list of addresses is the only hand-written
  # thing in the run and it is a list of where to look rather than a claim about what is
  # there.
  THE_PROJECTS: >-
    ai-sdlc-os:python ai-sdlc-os-plus:python ai-sdlc-app-rs:rust ai-sdlc-app-rs-plus:rust

jobs:
  collect:
    name: Read the four repositories
    runs-on: ubuntu-latest
    # **A step output is not a job output.** `has_anything_changed.mjs` writes `has_changed` to
    # `$GITHUB_OUTPUT` correctly, and that is not enough: what carries a value from this job to
    # `build` is this block. Without it the value is empty, `build`'s condition is false, the job
    # skips itself, `deploy` is skipped as its dependency, and the run reports success having
    # published nothing — which is why `test/the_workflow_publishes_the_page.test.mjs` reads this
    # file rather than the script it calls.
    outputs:
      has_changed: ${{ steps.changed.outputs.has_changed }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # **uv, installed and cached by an action rather than by a shell pipe.** Two `uv sync
      # --all-extras` runs of a langchain and langgraph dependency tree is the largest part of what a
      # run waits for, and the tree is identical every time the projects have not moved.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      # The four repositories are checked out first and everything else happens after, because the
      # Rust cache keys on the `Cargo.lock` files it is pointed at and they have to exist first.
      - name: Check out the four repositories
        run: |
          set -euo pipefail
          for one in $THE_PROJECTS; do
            the_name="${one%%:*}"
            git clone --quiet --branch "$THE_BRANCH" "https://github.com/steamnoid/$the_name.git" "build/$the_name"
          done

      # **The two Rust workspaces, keyed on the two lock files.** A dependency moving is a new
      # compile; a commit that touches no manifest is not. A cache keyed on the commit instead would
      # miss every run and upload a fresh copy of every build each time — costing more than the run
      # it was meant to shorten, and looking exactly like a working cache.
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: |
            build/ai-sdlc-app-rs -> target
            build/ai-sdlc-app-rs-plus -> target

      - name: Give each Python project its dependencies
        run: |
          set -euo pipefail
          for one in $THE_PROJECTS; do
            the_name="${one%%:*}"
            the_language="${one##*:}"
            [ "$the_language" = "python" ] || continue
            echo "::group::$the_name"
            uv sync --all-extras --project "build/$the_name"
            echo "::endgroup::"
          done

      # **A checkout of a fetched ref is detached and git calls itself `HEAD`.** The branch
      # that was asked for is the fact a reader wants, so the collector knows it because it
      # is the one that fetched it.
      - name: Read them, and run their own suites
        run: |
          set -euo pipefail
          the_family="["
          the_first="yes"
          for one in $THE_PROJECTS; do
            the_name="${one%%:*}"
            the_language="${one##*:}"
            [ "$the_first" = "yes" ] || the_family="$the_family,"
            the_first="no"
            the_family="$the_family{\"owner\":\"steamnoid\",\"name\":\"$the_name\",\"language\":\"$the_language\",\"interpreter\":\"python3\"}"
          done
          the_family="$the_family]"
          echo "$the_family" > /tmp/the_family.json
          node scripts/ask_the_family.mjs \
            --where "$GITHUB_WORKSPACE/build" \
            --out src/state/the_family.json \
            --family "$(cat /tmp/the_family.json)"

      - name: The page's own tests, which reach no network
        run: npm run --silent test:collectors

      - name: Has anything changed on the page
        id: changed
        run: node scripts/has_anything_changed.mjs --state src/state/the_family.json

      # **The directory, not the file.** An artifact of one file has that file's directory
      # as its root, so the download lands beside the committed copy — and the first
      # deployment of the page this one grew out of published months-old numbers while every
      # step reported success.
      - uses: actions/upload-artifact@v7
        with:
          name: the-state
          path: src/state
          retention-days: 7

  build:
    name: Build the page
    needs: collect
    # **The skip is right for a schedule and wrong for a person.** A schedule that finds the family
    # exactly where it was should not publish a byte-identical artifact, so `has_changed` skips the
    # build. But `workflow_dispatch` means somebody pressed a button, and refusing a request
    # because nothing had changed is not a skip — it is a green first stage and then silence, which
    # is the hardest shape of failure to notice. So a dispatch always builds.
    if: github.event_name == 'workflow_dispatch' || needs.collect.outputs.has_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - uses: actions/download-artifact@v8
        with:
          name: the-state
          path: src/state

      - run: npm ci

      - name: The page's tests, against the state that was read
        run: npm run --silent test:page

      - run: npm run --silent build

      - uses: actions/configure-pages@v6
        with:
          # Without this a repository that has never had a Pages site fails to configure,
          # and the first deployment is the one that discovers it.
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v5

  keepalive:
    name: Keep the schedule alive
    # **`needs: collect`, and not `needs: deploy`.** GitHub switches scheduled workflows off in a
    # public repository after 60 days without activity, and a page that rebuilds itself never
    # receives a commit — so this job pushes one empty commit once the silence passes 45 days, one a
    # month rather than two hundred a year.
    #
    # It hung off `deploy` at first, which reaches it only through `build`, which is skipped
    # whenever nothing changed. Nothing changing is the state a keepalive exists to survive: a page
    # that updates hourly is current almost always, so the rescue would never have run. It entered
    # on its first scheduled run by luck, because that run happened to find changed facts.
    #
    # An empty commit costs a collector run, not a deployment — `has_changed` will be false and the
    # build will skip, which is the whole of what a commit here is for.
    needs: collect
    # **The schedule, or a person saying so.** The condition is one `||` because the two are
    # answers to the same question — is it time to push a commit — asked by two different things.
    if: github.event_name == 'schedule' || inputs.as_if_the_silence_were_long_enough == true
    runs-on: ubuntu-latest
    # **`contents: write`, and it is the only job that asks.** The workflow grants `contents: read`
    # because nothing else may write this repository — and nothing else should: `Read the four
    # repositories` runs four other people's test suites on a runner holding this repository's token,
    # and a job that can push is a job that can change what the page says.
    #
    # This job was granted only the read it inherited, so `git push` had no token to push with. It
    # had failed twice already, both times on an `awk` this repository had also fixed, and fixing
    # the `awk` had fixed the first of the two reasons it could not work.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The history, not one commit. A job that reads the history is a job that cannot see what
          # it judges.
          fetch-depth: 0
      - name: Push a commit if the silence is nearly long enough
        env:
          # **Zero, and not a flag.** The script is asked for a number of days rather than told
          # whether to believe itself, so the thing it prints and the thing it acts on are the same
          # question. `&& 0 || 45` is the only way GitHub has to say one thing or the other.
          THE_LIMIT: ${{ inputs.as_if_the_silence_were_long_enough && 0 || 45 }}
        run: node scripts/keep_the_schedule_alive.mjs
